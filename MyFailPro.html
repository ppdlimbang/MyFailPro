<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sistem pengurusan dan pergerakan fail PPD Limbang">
  <title>Log Masuk · MyFailPro</title>
  <link rel="icon" type="image/png" href="file.png">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body data-page="login">
  <main class="login-page">
    <section class="panel login-card" aria-labelledby="loginTitle">
      <img class="brand-mark" src="file.png" alt="Logo MyFailPro">
      <h1 id="loginTitle">Log Masuk Sistem</h1>
      <p>Pengurusan Pergerakan Fail PPD Limbang</p>
      <form id="formLogin">
        <div class="field"><label for="loginEmail">Emel pengguna</label><input class="input" type="email" id="loginEmail" autocomplete="username" required placeholder="admin@moe.gov.my"></div>
        <div class="field"><label for="loginPassword">Katalaluan</label><input class="input" type="password" id="loginPassword" autocomplete="current-password" required placeholder="Masukkan katalaluan"></div>
        <button class="button" type="submit">Log Masuk</button>
      </form>
      <p class="login-note">Data prototaip ini disimpan pada pelayar peranti anda.</p>
    </section>
  </main>
</body>
</html>
