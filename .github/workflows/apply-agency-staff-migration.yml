name: Apply Agency Staff Migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-agency-staff-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DATABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ucneczznmwkyeemkdoxw
      MIGRATION_FILE: supabase/migrations/20260907030000_add_agency_staff_users.sql
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify database token
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Apply migration
        run: |
          jq -Rs '{ query: . }' "$MIGRATION_FILE" > "$RUNNER_TEMP/migration.json"
          status=$(curl --silent --show-error \
            --request POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/migration.json" \
            --output "$RUNNER_TEMP/migration-result.json" \
            --write-out '%{http_code}')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            message=$(jq -r '.message // .error // "Supabase menolak permintaan migrasi."' "$RUNNER_TEMP/migration-result.json")
            echo "::error title=Supabase migration rejected::$message (HTTP $status)"
            exit 1
          fi

      - name: Verify agency staff schema
        run: |
          jq -n --arg query "select exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = 'profiles' and column_name = 'agency_id') as agency_id_ready, to_regprocedure('public.current_workspace_owner()') is not null as workspace_function_ready" '{ query: $query, read_only: true }' > "$RUNNER_TEMP/verify.json"
          curl --silent --show-error --fail-with-body \
            --request POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/verify.json" \
            --output "$RUNNER_TEMP/verify-result.json"
          jq -e '.[0].agency_id_ready == true and .[0].workspace_function_ready == true' "$RUNNER_TEMP/verify-result.json" > /dev/null
